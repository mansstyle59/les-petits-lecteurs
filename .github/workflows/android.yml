name: Construire les APK Android

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "android"
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Copier l'application web dans l'APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html app contenu audio apple-touch-icon.png icon-192.png icon-512.png android/app/src/main/assets/www/

      - name: Compiler l'APK (téléphone et TV)
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Renommer les APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/*.apk dist/les-petits-lecteurs.apk
          ls -la dist

      - name: Conserver les APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-les-petits-lecteurs
          path: dist/*.apk

      - name: Publier la version d'essai
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete essai --yes --cleanup-tag || true
          gh release create essai dist/les-petits-lecteurs.apk \
            --target "${GITHUB_SHA}" --prerelease \
            --title "Version d'essai" \
            --notes "Une seule application pour téléphone, tablette et Android TV : les-petits-lecteurs.apk. Elle se met à jour toute seule depuis Internet : inutile de la réinstaller pour les nouvelles leçons ou corrections."
