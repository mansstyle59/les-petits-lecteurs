plugins {
    id "com.android.application"
}

android {
    namespace "fr.lespetitslecteurs"
    compileSdk 34

    defaultConfig {
        applicationId "fr.lespetitslecteurs"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.0"
        // Adresse de l'application en ligne : les mises à jour arrivent sans réinstaller l'APK
        buildConfigField "String", "APP_URL", "\"https://mansstyle59.github.io/les-petits-lecteurs/app/\""
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
}
